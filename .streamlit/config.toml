[theme]
base = "dark"
primaryColor = "#3B82F6"               # Cobalto: ações de governança
backgroundColor = "#0B0F17"            # Deep Obsidian / Carbon
secondaryBackgroundColor = "#161F30"   # Slate Surface / Cards
textColor = "#F1F5F9"                  # Alto contraste
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
