[theme]
# Perfil alternativo: .streamlit/themes/soft-light.toml
base = ".streamlit/themes/dark-premium.toml"
font = "sans serif"
baseFontSize = 14
headingFontSizes = ["2.25rem", "1.7rem", "1.3rem", "1.15rem", "1rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "2rem"

[client]
toolbarMode = "minimal"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
