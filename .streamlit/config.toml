[theme]
base = "dark"
primaryColor = "#3B82F6"               # Cobalto: ações de governança
backgroundColor = "#0B0F17"            # Deep Obsidian / Carbon
secondaryBackgroundColor = "#161F30"   # Slate Surface / Cards
textColor = "#F1F5F9"                  # Alto contraste
font = "sans serif"
baseFontSize = 14
headingFontSizes = ["2.25rem", "1.7rem", "1.3rem", "1.15rem", "1rem", "0.9rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "2rem"

[client]
toolbarMode = "minimal"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
