[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdms"
version = "0.1.0"
description = "Creator Data Marketing System - Governança Semanal e Diagnóstico Heurístico"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CDMS Engineering Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

# Dependências da interface local
# sqlite3 faz parte da biblioteca padrão do Python
dependencies = [
    "streamlit>=1.57.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.2",
    "plotly>=5.0.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4,<1.8",
    # Passlib 1.7.4 requer a API legada de bcrypt.
    "bcrypt>=3.2.0,<4.1",
    "pydantic[email]>=2.6.0",
]
automation = [
    "celery>=5.3.6",
    "redis>=5.0.3",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cdms*", "cgs*"]
